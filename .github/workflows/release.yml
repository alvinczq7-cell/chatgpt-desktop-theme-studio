name: Windows release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify packages and resources
        run: python tools/verify_static.py
      - name: Restore and test
        run: |
          dotnet restore ThemeStudio.sln
          dotnet test tests/ThemeStudio.Tests/ThemeStudio.Tests.csproj -c Release -p:Platform=x64
      - name: Publish portable folder
        run: dotnet publish src/ThemeStudio/ThemeStudio.csproj -c Release -r win-x64 --self-contained true -p:WindowsAppSDKSelfContained=true -o artifacts/publish
      - name: Build sample theme packages
        run: python tools/build_sample_themes.py
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          iscc /DAppVersion=$version /Oartifacts installer/ThemeStudio.iss
      - name: Create portable archive and checksums
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/ThemeStudio-portable-win-x64.zip
          $releaseFiles = @(Get-ChildItem artifacts -File | Where-Object { $_.Extension -in '.zip', '.exe' }) + @(Get-ChildItem samples/packages -File -Filter '*.tstheme')
          $releaseFiles | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content -LiteralPath artifacts/SHA256SUMS.txt
          }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ThemeStudio-Setup.exe
            artifacts/ThemeStudio-portable-win-x64.zip
            artifacts/SHA256SUMS.txt
            samples/packages/*.tstheme
