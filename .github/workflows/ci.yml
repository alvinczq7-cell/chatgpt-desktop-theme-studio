name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify packages and resources
        run: python tools/verify_static.py
      - name: Restore
        run: dotnet restore ThemeStudio.sln
      - name: Build
        run: dotnet build ThemeStudio.sln -c Release --no-restore
      - name: Test
        run: dotnet test tests/ThemeStudio.Tests/ThemeStudio.Tests.csproj -c Release -p:Platform=x64 --no-build
