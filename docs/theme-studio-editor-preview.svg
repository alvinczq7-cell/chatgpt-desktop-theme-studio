<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">ChatGPT Desktop Theme Studio editor preview</title>
  <desc id="desc">A concept illustration of the Theme Studio editor with appearance controls and a clearly labeled simulated ChatGPT preview.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10131b"/><stop offset="1" stop-color="#20283a"/></linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8c66ff"/><stop offset=".48" stop-color="#287dd2"/><stop offset="1" stop-color="#1a9d91"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#202632" stop-opacity=".93"/><stop offset="1" stop-color="#171c26" stop-opacity=".96"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".42"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
    <clipPath id="previewClip"><rect x="721" y="223" width="653" height="556" rx="15"/></clipPath>
